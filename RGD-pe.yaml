apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: web-application
spec:
  schema:
    apiVersion: v1alpha1
    kind: WebApplication
    spec:
      name: string
      image: string | default="nginx:1.30"
      replicas: integer | default=3
    # Propagates child resource status up to the Instance level
    status:
      # Populated by ACK once the S3 Bucket is created
      bucketArn: ${bucket.status.ackResourceMetadata.arn}
      # ?. = safe navigation operator — returns 0 if readyReplicas field doesn't exist yet
      # Becomes true when at least one replica is running and ready
      ready: ${deployment.status.?readyReplicas.orValue(0) > 0}
  resources:
    # Create S3 bucket with ACK
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.spec.name}-assets
          annotations:
            # Preserve the bucket when the Instance is deleted — prevents data loss
            # Change to "delete" if you want ACK to clean up the bucket on teardown
            services.k8s.aws/deletion-policy: retain
        spec:
          name: ${schema.spec.name}-assets
    # Inject app details into the Kubernetes Deployment
    - id: configmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-config
        data:
          APP_NAME:  ${schema.spec.name}
    # Use ConfigMap and Bucket to inject environment variables
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.spec.name}
          template:
            metadata:
              labels:
                app: ${schema.spec.name}
            spec:
              containers:
                - name: app
                  image: ${schema.spec.image}
                  envFrom:
                  - configMapRef:
                      # kro infers a dependency on the configmap resource from this reference
                      name: ${configmap.metadata.name}
                  env:
                    # kro infers a dependency on the bucket resource from this reference
                    # Deployment will not be created until ACK has reconciled the bucket
                    - name: BUCKET_NAME
                      value: ${bucket.metadata.name}
                    - name: BUCKET_ARN
                      value: ${bucket.status.ackResourceMetadata.arn}
    # Expose deployment via Service
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
        spec:
          selector: ${deployment.spec.selector.matchLabels}
          ports:
            - port: 80
              targetPort: 80